              <button onClick={backToSetup} style={{ padding: "6px 12px", borderRadius: 6, border: "1px solid " + sk.panelBorder, background: sk.btnPassive, color: sk.accent, fontSize: 11, cursor: "pointer", fontFamily: "'Georgia', serif" }}>Lobby</button>
            </div>
          </div>
          <div style={{ display: "flex", justifyContent: "center", gap: isLandscape ? 16 : 28, padding: isLandscape ? "2px 14px" : "6px 14px", background: "rgba(0,0,0,0.15)" }}>
            <div style={{ textAlign: "center" }}>
              <div style={{ fontSize: isLandscape ? 8 : 10, color: "#4CAF50", letterSpacing: 1 }}>{localMode ? "PLAYER 1" : "YOU"}</div>
              <div style={{ fontSize: isLandscape ? 16 : 24, fontWeight: "bold", color: "#4CAF50" }}>{board[6]}</div>
            </div>
            <div style={{ fontSize: isLandscape ? 12 : 16, color: sk.textDim, alignSelf: "center" }}>vs</div>
            <div style={{ textAlign: "center" }}>
              <div style={{ fontSize: isLandscape ? 8 : 10, color: "#e67e22", letterSpacing: 1 }}>{localMode ? "PLAYER 2" : "CPU"}</div>
              <div style={{ fontSize: isLandscape ? 16 : 24, fontWeight: "bold", color: "#e67e22" }}>{board[13]}</div>
            </div>
          </div>
          <div style={{ flex: 1, minHeight: 0, display: "flex", alignItems: "center", justifyContent: "center", padding: isLandscape ? "4px 6px" : "12px 6px" }}>
            <div ref={boardWrapRef} style={{
              background: sk.boardBg,
              borderRadius: Math.round(32 * bscale), padding: bscale < 0.8 ? "10px 4px" : isLandscape ? "14px 8px" : "14px 10px",
              width: "100%", maxWidth: 540,
              border: "3px solid " + sk.boardBorder,
              boxShadow: "0 10px 40px rgba(0,0,0,0.6), inset 0 2px 0 rgba(255,255,255,0.08)",
              display: "flex", flexDirection: isLandscape ? "row" : "column",
              alignItems: "stretch", gap: Math.round(6 * bscale),
              minHeight: isLandscape ? Math.round(190 * bscale) : undefined,
              position: "relative",
            }}>
              {isLandscape ? renderStore(13, localMode ? "P2" : "CPU", "#e67e22") : renderStoreH(13, localMode ? "P2" : "CPU", "#e67e22")}
              <div style={{ flex: isLandscape ? 1 : "none", display: "flex", flexDirection: "column", gap: 6, justifyContent: "center" }}>
                <div style={{ display: "flex", gap: 3 }}>{[12,11,10,9,8,7].map(i => renderPit(i, false))}</div>
                <div style={{ fontSize: 8, color: sk.textDim, display: "flex", justifyContent: "space-between", padding: "0 4px", opacity: 0.7 }}>
                  <span>{localMode ? "Player 2 side" : "CPU side"}</span><span>{localMode ? "Player 1 side" : "Your side"}</span>
                </div>
                <div style={{ display: "flex", gap: 3 }}>{[0,1,2,3,4,5].map(i => renderPit(i, true))}</div>
              </div>
              {isLandscape ? renderStore(6, localMode ? "P1" : "YOU", "#4CAF50") : renderStoreH(6, localMode ? "P1" : "YOU", "#4CAF50")}
              {/* Animation overlay: single reusable flying stone, driven via ref (no React per-frame). */}
              <div style={{ position: "absolute", inset: 0, pointerEvents: "none", zIndex: 20, overflow: "visible" }}>
                <div ref={flyerRef} style={{
                  position: "absolute", top: 0, left: 0, width: 17, height: 17, borderRadius: "50%",
                  display: "none", willChange: "transform",
                  background: sk.marble,
                  boxShadow: "inset -2px -3px 5px rgba(0,0,0,0.3), inset 2px 2px 3px rgba(255,255,255,0.2), 0 3px 6px rgba(0,0,0,0.45)",
                }} />
              </div>
            </div>
          </div>
          <div style={{ textAlign: "center", padding: isLandscape ? "2px 16px" : "6px 16px", fontSize: isLandscape ? 11 : 13, color: gameOver ? sk.accent : sk.text, fontWeight: gameOver ? "bold" : "normal", minHeight: isLandscape ? 18 : 28 }}>{message}</div>
          {training && strategy && !gameOver && currentPlayer === 0 && !busy && (
            <div style={{ margin: "0 auto", width: "100%", maxWidth: 500, padding: isLandscape ? "2px 12px" : "10px 16px", borderRadius: 12, background: "rgba(0,0,0,0.4)", border: "1px solid rgba(52,152,219,0.3)" }}>
              <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: isLandscape ? 2 : 5 }}>
                <span style={{ fontSize: isLandscape ? 10 : 13, fontWeight: "bold", color: "#3498db", letterSpacing: 1 }}>STRATEGY</span>
              </div>
              <div style={{ fontSize: isLandscape ? 10 : 12, color: sk.accent, lineHeight: 1.5, marginBottom: isLandscape ? 3 : 6 }}>{strategy.tip}</div>
              <div style={{ display: "flex", flexWrap: "wrap", gap: 4 }}>
                {strategy.analyses.map(a => {
                  const isBest = a.pit === strategy.bestMove;
                  return (
                    <div key={a.pit} style={{
                      padding: "3px 7px", borderRadius: 6, fontSize: 10,
                      background: isBest ? "rgba(218,165,87,0.2)" : "rgba(60,40,20,0.4)",
                      border: isBest ? "1px solid " + sk.accent : "1px solid rgba(60,40,20,0.3)",
                      color: isBest ? sk.accent : sk.textDim,
                    }}>
                      <span style={{ fontWeight: "bold" }}>Pit {a.pit + 1}</span>
                      {a.extraTurn && <span style={{ color: "#4CAF50", marginLeft: 3 }}>+turn</span>}
                      {a.captured > 0 && <span style={{ color: "#e67e22", marginLeft: 3 }}>+{a.captured}cap</span>}
                      <span style={{ marginLeft: 3, color: a.scoreDiff > 0 ? "#4CAF50" : a.scoreDiff < 0 ? "#e74c3c" : "#5a4a3a" }}>
                        {a.scoreDiff > 0 ? "+" + a.scoreDiff : a.scoreDiff}
                      </span>
                    </div>
                  );
                })}
              </div>
            </div>
          )}
          {gameOver && (
            <div style={{ textAlign: "center", padding: isLandscape ? "4px 0 6px" : "8px 0 12px", display: "flex", gap: 8, justifyContent: "center" }}>
              <button onClick={handlePlayAgain} style={{ padding: isLandscape ? "8px 24px" : "12px 28px", borderRadius: 10, border: "none", background: sk.btnActive, color: sk.accentText, fontWeight: "bold", fontSize: isLandscape ? 14 : 16, cursor: "pointer", fontFamily: "'Georgia', serif" }}>PLAY AGAIN</button>
              <button onClick={backToSetup} style={{ padding: isLandscape ? "8px 24px" : "12px 28px", borderRadius: 10, border: "1px solid " + sk.panelBorder, background: sk.btnPassive, color: sk.accent, fontWeight: "bold", fontSize: isLandscape ? 12 : 14, cursor: "pointer", fontFamily: "'Georgia', serif" }}>LOBBY</button>
            </div>
          )}
          {!adsRemoved && adMobReady && <div style={{ minHeight: 80, flexShrink: 0 }} />}
          {prePromptOverlay}
        </div>
      );
    }

    const rootEl = document.getElementById("root");
    if (!rootEl) throw new Error("Root element not found");
    const root = ReactDOM.createRoot(rootEl);
    root.render(<Mancala />);
  </script>
</body>
</html>
