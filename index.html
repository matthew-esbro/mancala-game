<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Mancala - Stone & Pit</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { overflow: hidden; background: #1a0e07; height: 100%; }
    #root {
      height: 100%;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Game engine: single source of truth for rules + AI.
       Used in three places: the AI Web Worker (blob = this text + onmessage harness),
       the main thread (extracted via new Function), and simulate.js (regex-extracted).
       Keep this block free of DOM/React references. -->
  <script id="game-engine" type="text/worker">
    function initBoard() {
      const b = new Array(14).fill(4);
      b[6] = 0; b[13] = 0;
      return b;
    }
    function getValidMoves(board, player) {
      const start = player === 0 ? 0 : 7;
      const moves = [];
      for (let i = start; i < start + 6; i++) if (board[i] > 0) moves.push(i);
      return moves;
    }
    function nextPit(idx, player) {
      const skip = player === 0 ? 13 : 6;
      let n = (idx + 1) % 14;
      if (n === skip) n = (n + 1) % 14;
      return n;
    }
    function sowResult(board, pit, player) {
      const b = [...board];
      let stones = b[pit]; b[pit] = 0; let idx = pit;
      const sequence = [];
      while (stones > 0) { idx = nextPit(idx, player); b[idx]++; stones--; sequence.push(idx); }
      const myStore = player === 0 ? 6 : 13;
      const extraTurn = idx === myStore;
      const myPits = player === 0 ? [0,1,2,3,4,5] : [7,8,9,10,11,12];
      let captured = 0;
      if (!extraTurn && myPits.includes(idx) && b[idx] === 1) {
        const opp = 12 - idx;
        if (b[opp] > 0) { captured = b[opp] + 1; b[myStore] += b[opp] + 1; b[opp] = 0; b[idx] = 0; }
      }
      return { finalBoard: b, extraTurn, sequence, captured };
    }
    function isGameOver(board) {
      return board.slice(0, 6).every(function(v) { return v === 0; }) || board.slice(7, 13).every(function(v) { return v === 0; });
    }
    function finalizeBoard(board) {
      const b = [...board];
      for (let i = 0; i < 6; i++) { b[6] += b[i]; b[i] = 0; }
      for (let i = 7; i < 13; i++) { b[13] += b[i]; b[i] = 0; }
      return b;
    }
    function getWinner(board) {
      if (board[6] > board[13]) return 0;
      if (board[13] > board[6]) return 1;
      return -1;
    }
    // Sow every legal move once and order best-first (extra turns, then big captures).
    // Alpha-beta prunes far more when strong moves are searched first, and the search
    // loop reuses these sow results instead of recomputing them.
    function orderedResults(board, player) {
      const list = getValidMoves(board, player).map(function(m) {
        return { m: m, r: sowResult(board, m, player) };
      });
      list.sort(function(a, b) {
        if (a.r.extraTurn !== b.r.extraTurn) return a.r.extraTurn ? -1 : 1;
        return b.r.captured - a.r.captured;
      });
      return list;
    }
    function evaluateBoard(board, player) {
      var myStore = player === 0 ? 6 : 13;
      var oppStore = player === 0 ? 13 : 6;
      var myStart = player === 0 ? 0 : 7;
      var oppStart = player === 0 ? 7 : 0;
      // Store difference (primary, heavily weighted)
      var score = (board[myStore] - board[oppStore]) * 10;
      // Seed control: seeds on my side vs opponent's side
      var mySeeds = 0, oppSeeds = 0;
      for (var i = 0; i < 6; i++) {
        mySeeds += board[myStart + i];
        oppSeeds += board[oppStart + i];
      }
      score += (mySeeds - oppSeeds) * 2;
      // Capture threats: empty pits on my side with seeds opposite
      for (var i = 0; i < 6; i++) {
        var pit = myStart + i;
        var opp = 12 - pit;
        if (board[pit] === 0 && board[opp] > 0) {
          score += Math.min(board[opp], 6); // potential capture value (capped)
        }
      }
      // Opponent capture threats: penalize empty pits on their side with our seeds
      for (var i = 0; i < 6; i++) {
        var pit = oppStart + i;
        var opp = 12 - pit;
        if (board[pit] === 0 && board[opp] > 0) {
          score -= Math.min(board[opp], 4); // danger penalty
        }
      }
      // Extra turn opportunities: pit where stones land exactly in store
      for (var i = 0; i < 6; i++) {
        var pit = myStart + i;
        var distToStore = myStore - pit;
        if (board[pit] > 0 && board[pit] === distToStore) {
          score += 4; // bonus for available extra turns
        }
      }
      // If game is over, who is winning is all that matters (make it decisive)
      if (mySeeds === 0 || oppSeeds === 0) {
        score = (board[myStore] + mySeeds - board[oppStore] - oppSeeds) * 100;
      }
      return score;
    }
    function minimax(board, depth, alpha, beta, maximizing, orig, absDepth) {
      if (absDepth === undefined) absDepth = 24;
      if (depth === 0 || absDepth === 0 || isGameOver(board)) {
        var evalBoard = isGameOver(board) ? finalizeBoard(board) : board;
        return { score: evaluateBoard(evalBoard, orig), move: -1 };
      }
      const cur = maximizing ? orig : 1 - orig;
      const list = orderedResults(board, cur);
      if (list.length === 0) return { score: evaluateBoard(finalizeBoard(board), orig), move: -1 };
      let bestMove = list[0].m;
      if (maximizing) {
        let mx = -Infinity;
        for (const it of list) {
          const { score } = minimax(it.r.finalBoard, it.r.extraTurn ? depth : depth - 1, alpha, beta, it.r.extraTurn, orig, absDepth - 1);
          if (score > mx) { mx = score; bestMove = it.m; }
          alpha = Math.max(alpha, score);
          if (beta <= alpha) break;
        }
        return { score: mx, move: bestMove };
      } else {
        let mn = Infinity;
        for (const it of list) {
          const { score } = minimax(it.r.finalBoard, it.r.extraTurn ? depth : depth - 1, alpha, beta, !it.r.extraTurn, orig, absDepth - 1);
          if (score < mn) { mn = score; bestMove = it.m; }
          beta = Math.min(beta, score);
          if (beta <= alpha) break;
        }
        return { score: mn, move: bestMove };
      }
    }
    function cpuMove(board, player, level) {
      const moves = getValidMoves(board, player);
      if (moves.length === 0) return -1;
      if (level === "rookie") {
        const extras = moves.filter(function(m) { return sowResult(board, m, player).extraTurn; });
        if (extras.length > 0 && Math.random() < 0.5) return extras[Math.floor(Math.random() * extras.length)];
        return moves[Math.floor(Math.random() * moves.length)];
      }
      if (level === "sharp") {
        var scored = moves.map(function(m) {
          var r = sowResult(board, m, player);
          var sc = evaluateBoard(r.finalBoard, player) * 2;
          if (r.extraTurn) sc += 15;
          sc += (Math.random() - 0.5) * 2;
          return { move: m, score: sc };
        });
        scored.sort(function(a, b) { return b.score - a.score; });
        return scored[0].move;
      }
      var results = moves.map(function(m) {
        var r = sowResult(board, m, player);
        var s = minimax(r.finalBoard, r.extraTurn ? 10 : 9, -Infinity, Infinity, r.extraTurn, player);
        return { move: m, score: s.score };
      });
      var topScore = results.reduce(function(a, b) { return b.score > a.score ? b : a; }).score;
      var ties = results.filter(function(r) { return r.score === topScore; });
      return ties[Math.floor(Math.random() * ties.length)].move;
    }
    function getStrategy(board, player) {
      const moves = getValidMoves(board, player);
      if (moves.length === 0) return null;
      const analyses = moves.map(function(m) {
        const { finalBoard: nb, extraTurn, captured } = sowResult(board, m, player);
        const diff = evaluateBoard(nb, player) - evaluateBoard(board, player);
        return { pit: m, extraTurn: extraTurn, captured: captured, scoreDiff: diff };
      });
      analyses.sort(function(a, b) {
        if (a.extraTurn !== b.extraTurn) return a.extraTurn ? -1 : 1;
        return b.scoreDiff - a.scoreDiff;
      });
      var best = analyses[0];
      var mmMoves = getValidMoves(board, player);
      var mmResults = mmMoves.map(function(m) {
        var r = sowResult(board, m, player);
        var s = minimax(r.finalBoard, r.extraTurn ? 10 : 9, -Infinity, Infinity, r.extraTurn, player);
        return { move: m, score: s.score };
      });
      var mmTop = mmResults.reduce(function(a, b) { return b.score > a.score ? b : a; }).score;
      var mmTies = mmResults.filter(function(r) { return r.score === mmTop; });
      var mmMove = mmTies[Math.floor(Math.random() * mmTies.length)].move;
      const pl = best.pit + 1, ml = mmMove + 1;
      let tip = "";
      if (best.extraTurn) tip = "Pit " + pl + " gives you an extra turn! Always take free turns.";
      else if (best.captured > 0) tip = "Pit " + pl + " captures " + best.captured + " stones. Strong move.";
      else if (best.scoreDiff > 0) tip = "Pit " + pl + " gains +" + best.scoreDiff + " advantage.";
      else tip = "Pit " + pl + " is the safest option.";
      if (mmMove !== best.pit) tip += " Deep analysis prefers Pit " + ml + ".";
      return { bestMove: mmMove, analyses: analyses, tip: tip };
    }
  </script>

  <script type="text/babel">
    const { useState, useCallback, useRef, useEffect } = React;

    // ── Responsive scaling ──
    function useWindowSize() {
      const [size, setSize] = useState({ w: window.innerWidth, h: window.innerHeight });
      useEffect(() => {
        const onResize = () => setSize({ w: window.innerWidth, h: window.innerHeight });
        window.addEventListener("resize", onResize);
        return () => window.removeEventListener("resize", onResize);
      }, []);
      return size;
    }
    function getScale(width) {
      if (width >= 540) return 1.0;
      if (width <= 340) return 0.55;
      return 0.55 + (width - 340) / (540 - 340) * 0.45;
    }

    // ── Shared game engine (single source: the game-engine script block) ──
    // The main thread evaluates the same code the worker runs, so rules can
    // never drift between the UI and the AI.
    const ENGINE_EL = document.getElementById("game-engine");
    if (!ENGINE_EL) throw new Error("game-engine script element not found");
    const ENGINE_SRC = ENGINE_EL.textContent;
    const Engine = new Function(ENGINE_SRC +
      "\nreturn { initBoard: initBoard, getValidMoves: getValidMoves, nextPit: nextPit, sowResult: sowResult, isGameOver: isGameOver, finalizeBoard: finalizeBoard, getWinner: getWinner };")();
    const initBoard = Engine.initBoard;
    const getValidMoves = Engine.getValidMoves;
    const nextPit = Engine.nextPit;
    const sowResult = Engine.sowResult;
    const isGameOver = Engine.isGameOver;
    const finalizeBoard = Engine.finalizeBoard;
    const getWinner = Engine.getWinner;

    const WORKER_HARNESS = "\nself.onmessage = function(e) {\n" +
      "  const d = e.data;\n" +
      "  if (d.type === 'cpuMove') {\n" +
      "    self.postMessage({ type: 'cpuMove', move: cpuMove(d.board, d.player, d.level), id: d.id });\n" +
      "  } else if (d.type === 'strategy') {\n" +
      "    self.postMessage({ type: 'strategy', result: getStrategy(d.board, d.player), id: d.id });\n" +
      "  }\n" +
      "};\n";

    function createAIWorker() {
      const blob = new Blob([ENGINE_SRC, WORKER_HARNESS], { type: "application/javascript" });
      const url = URL.createObjectURL(blob);
      const worker = new Worker(url);
      URL.revokeObjectURL(url);
      return worker;
    }

    // ── Stable marble ID system ──
    let _marbleIdCounter = 0;
    function generateMarbleIds(count) {
      const ids = [];
      for (let i = 0; i < count; i++) ids.push(++_marbleIdCounter);
      return ids;
    }
    function initMarbleMap() {
      const map = {};
      for (let i = 0; i < 14; i++) {
        if (i === 6 || i === 13) { map[i] = []; }
        else { map[i] = generateMarbleIds(4); }
      }
      return map;
    }
    function updateMarbleMap(prevMap, prevBoard, newBoard, sequence, sourcePit, captured, player) {
      const map = {};
      for (let i = 0; i < 14; i++) map[i] = [...(prevMap[i] || [])];
      // Remove all marbles from source pit
      const moving = map[sourcePit].splice(0);
      // Drop one marble into each pit in the sequence
      for (let s = 0; s < sequence.length; s++) {
        const target = sequence[s];
        if (s < moving.length) {
          map[target].push(moving[s]);
        } else {
          map[target].push(generateMarbleIds(1)[0]);
        }
      }
      // Handle capture: move marbles from captured pit + landing pit to store
      if (captured > 0) {
        const lastPit = sequence[sequence.length - 1];
        const opp = 12 - lastPit;
        const myStore = player === 0 ? 6 : 13;
        const capturedMarbles = map[opp].splice(0);
        const landingMarbles = map[lastPit].splice(0);
        map[myStore].push(...capturedMarbles, ...landingMarbles);
      }
      // Sync: ensure each pit's marble count matches the board
      for (let i = 0; i < 14; i++) {
        const target = newBoard[i];
        while (map[i].length < target) map[i].push(generateMarbleIds(1)[0]);
        while (map[i].length > target) map[i].pop();
      }
      return map;
    }

    // ── Marble offsets cache (stable per marble ID) ──
    let marbleOffsets = {};
    function clearMarbleOffsets() { marbleOffsets = {}; }
    function getMarbleOffset(id) {
      if (!marbleOffsets[id]) {
        marbleOffsets[id] = {
          ox: Math.round((Math.random() - 0.5) * 3),
          oy: Math.round((Math.random() - 0.5) * 3),
        };
      }
      return marbleOffsets[id];
    }

    const DEFAULT_MARBLE = "radial-gradient(circle at 30% 25%, rgba(255,255,255,0.6), #c8a050 30%, #a07830 58%, #886828 82%, #705520 100%)";
    function Marble({ id, size = 18, bg = DEFAULT_MARBLE }) {
      const { ox, oy } = getMarbleOffset(id);
      return (
        <div style={{
          width: size, height: size, borderRadius: "50%", flexShrink: 0,
          background: bg,
          boxShadow: "inset -2px -3px 5px rgba(0,0,0,0.3), inset 2px 2px 3px rgba(255,255,255,0.2), 0 2px 4px rgba(0,0,0,0.35)",
          transform: "translate(" + ox + "px, " + oy + "px)",
        }} />
      );
    }

    const CPU_LABELS = { rookie: "Rookie", sharp: "Sharp", counter: "Counter" };
    const CPU_CLR = { rookie: "#e67e22", sharp: "#3498db", counter: "#9b59b6" };

    // ── Color themes (full reskin: board, pits, stones, UI) ──
    const SKINS = {
      classic: {
        name: "Classic", swatch: "#3a2210",
        bg1: "#1a0e07", bg2: "#2d1810",
        accent: "#daa557", accentText: "#1a0e07", text: "#e8d5a3", textDim: "#8a6a4a",
        panel: "rgba(42,26,14,0.85)", panelBorder: "#5a3a20",
        btnActive: "linear-gradient(135deg, #c0952a, #daa557, #c0952a)", btnPassive: "rgba(90,58,32,0.5)",
        titleShadow: "0 0 30px rgba(218,165,87,0.3), 2px 2px 0 #6b4226",
        boardBg: "linear-gradient(145deg, #5a3a20, #3a2210, #5a3a20)", boardBorder: "#6b4226",
        pitBg: "radial-gradient(circle, #3a2518, #2a1a10)", pitBorder: "#3a2518",
        storeBg: "radial-gradient(circle, #3a2518, #1a1208)", storeBorder: "#4a3020",
        marble: "radial-gradient(circle at 30% 25%, rgba(255,255,255,0.6), #c8a050 30%, #a07830 58%, #886828 82%, #705520 100%)",
      },
      ivory: {
        name: "Ivory", swatch: "#d4b888",
        bg1: "#f0e8d0", bg2: "#e3d4b4",
        accent: "#7a4818", accentText: "#fcf4e0", text: "#3a2818", textDim: "#7a5838",
        panel: "rgba(250,243,224,0.92)", panelBorder: "#a8804c",
        btnActive: "linear-gradient(135deg, #8a5828, #b88848, #8a5828)", btnPassive: "rgba(200,168,124,0.5)",
        titleShadow: "0 0 18px rgba(122,72,24,0.15), 2px 2px 0 #c8a878",
        boardBg: "linear-gradient(145deg, #d4b888, #b89868, #d4b888)", boardBorder: "#8a6838",
        pitBg: "radial-gradient(circle, #a88858, #856636)", pitBorder: "#8a6838",
        storeBg: "radial-gradient(circle, #b89868, #856636)", storeBorder: "#8a6838",
        marble: "radial-gradient(circle at 30% 25%, rgba(255,255,255,0.45), #6a4828 30%, #4a3018 60%, #3a2010 85%, #2a1808 100%)",
      },
      emerald: {
        name: "Emerald", swatch: "#2a4a30",
        bg1: "#141e14", bg2: "#1e2a1c",
        accent: "#b8a868", accentText: "#141e14", text: "#d8d0b8", textDim: "#7a7a60",
        panel: "rgba(20,30,20,0.85)", panelBorder: "#4a5a3a",
        btnActive: "linear-gradient(135deg, #8a7a40, #b8a868, #8a7a40)", btnPassive: "rgba(40,50,30,0.5)",
        titleShadow: "0 0 20px rgba(184,168,104,0.2), 2px 2px 0 #2a3a20",
        boardBg: "linear-gradient(145deg, #3a5a38, #2a4a30, #3a5a38)", boardBorder: "#4a6040",
        pitBg: "radial-gradient(circle, #2a3a20, #18260f)", pitBorder: "#2a3a20",
        storeBg: "radial-gradient(circle, #2a3a20, #141e14)", storeBorder: "#3a4a30",
        marble: "radial-gradient(circle at 30% 25%, rgba(255,255,255,0.6), #f0e8c8 30%, #d0c890 60%, #a89868 85%, #8a7a50 100%)",
      },
      midnight: {
        name: "Midnight", swatch: "#182030",
        bg1: "#0c1018", bg2: "#141a24",
        accent: "#b8a060", accentText: "#0c1018", text: "#c8c0a8", textDim: "#686058",
        panel: "rgba(12,16,24,0.85)", panelBorder: "#384050",
        btnActive: "linear-gradient(135deg, #8a7838, #b8a060, #8a7838)", btnPassive: "rgba(30,35,50,0.5)",
        titleShadow: "0 0 20px rgba(184,160,96,0.2), 2px 2px 0 #141a28",
        boardBg: "linear-gradient(145deg, #222a3a, #182030, #222a3a)", boardBorder: "#384050",
        pitBg: "radial-gradient(circle, #141a28, #0a0e16)", pitBorder: "#283040",
        storeBg: "radial-gradient(circle, #1a2030, #0c1018)", storeBorder: "#384050",
        marble: "radial-gradient(circle at 30% 25%, rgba(255,255,255,0.5), #d8c080 30%, #b8a060 60%, #8a7838 85%, #6a5828 100%)",
      },
    };
    const SKIN_KEYS = ["classic", "ivory", "emerald", "midnight"];
    function getSkin(key) { return SKINS[key] || SKINS.classic; }

    // ── Haptics (Capacitor) ──
    function hapticImpact(style) {
      try { if (typeof Capacitor !== 'undefined' && Capacitor.Plugins.Haptics) Capacitor.Plugins.Haptics.impact({ style }); } catch (e) {}
    }
    function hapticLight() { hapticImpact('LIGHT'); }
    function hapticMedium() { hapticImpact('MEDIUM'); }
    function hapticHeavy() { hapticImpact('HEAVY'); }

    // ── Firebase Analytics + Crashlytics (Capacitor plugins; native only, no-op on web) ──
    function fbPlugin(name) {
      try { return (typeof Capacitor !== 'undefined' && Capacitor.Plugins && Capacitor.Plugins[name]) || null; } catch (e) { return null; }
    }
    function fbEnable() {
      try { const c = fbPlugin('FirebaseCrashlytics'); if (c && c.setEnabled) c.setEnabled({ enabled: true }); } catch (e) {}
      try { const a = fbPlugin('FirebaseAnalytics'); if (a && a.setEnabled) a.setEnabled({ enabled: true }); } catch (e) {}
    }
    function fbLogEvent(name, params) {
      try { const a = fbPlugin('FirebaseAnalytics'); if (a && a.logEvent) a.logEvent({ name: name, params: params || {} }); } catch (e) {}
    }

    // ── Sound effects (WebAudio, synthesized: no asset files) ──
    let sndCtx = null;
    let soundEnabled = (() => { try { return localStorage.getItem('mancalaSound') !== 'off'; } catch (e) { return true; } })();
    // Must be called from a user gesture at least once so iOS unlocks audio.
    function sndInit() {
      if (!soundEnabled) return null;
      try {
        if (!sndCtx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return null;
          sndCtx = new AC();
        }
        if (sndCtx.state === 'suspended') sndCtx.resume().catch(() => {});
        return sndCtx;
      } catch (e) { sndCtx = null; return null; }
    }
    function setSoundEnabled(on) {
      soundEnabled = on;
      try { localStorage.setItem('mancalaSound', on ? 'on' : 'off'); } catch (e) {}
      if (on) sndInit();
    }
    function tone(freq, dur, opts) {
      if (!soundEnabled) return;
      const ctx = sndInit();
      if (!ctx) return;
      try {
        const o = opts || {};
        const t0 = ctx.currentTime + (o.delay || 0);
        const osc = ctx.createOscillator();
        const g = ctx.createGain();
        osc.type = o.type || 'sine';
        osc.frequency.setValueAtTime(freq, t0);
        if (o.slide) osc.frequency.exponentialRampToValueAtTime(o.slide, t0 + dur);
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(o.gain || 0.1, t0 + 0.008);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
        osc.connect(g); g.connect(ctx.destination);
        osc.start(t0); osc.stop(t0 + dur + 0.03);
      } catch (e) {}
    }
    function sfxDrop() { tone(1300 + Math.random() * 500, 0.06, { type: 'triangle', slide: 600, gain: 0.09 }); }
    function sfxCapture() {
      tone(900, 0.1, { type: 'triangle', slide: 1500, gain: 0.13 });
      tone(1400, 0.13, { type: 'triangle', slide: 2100, gain: 0.11, delay: 0.08 });
    }
    function sfxExtra() {
      tone(880, 0.09, { gain: 0.11 });
      tone(1320, 0.12, { gain: 0.11, delay: 0.07 });
    }
    function sfxWin() { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.16, { type: 'triangle', gain: 0.12, delay: i * 0.09 })); }
    function sfxLose() { [392, 311, 262].forEach((f, i) => tone(f, 0.2, { gain: 0.1, delay: i * 0.12 })); }
    function sfxTie() { [440, 440].forEach((f, i) => tone(f, 0.12, { gain: 0.09, delay: i * 0.12 })); }

    // ── Stats (standard vs-CPU games only; training and pass-and-play excluded) ──
    const STATS_KEY = 'mancalaStats';
    const STATS_LEVELS = ['rookie', 'sharp', 'counter'];
    function emptyStats() {
      return { levels: { rookie: { w: 0, l: 0, t: 0 }, sharp: { w: 0, l: 0, t: 0 }, counter: { w: 0, l: 0, t: 0 } }, streak: 0, bestStreak: 0 };
    }
    function loadStats() {
      try {
        const raw = JSON.parse(localStorage.getItem(STATS_KEY));
        if (!raw || typeof raw !== 'object' || !raw.levels) return emptyStats();
        for (const k of STATS_LEVELS) if (!raw.levels[k]) raw.levels[k] = { w: 0, l: 0, t: 0 };
        if (typeof raw.streak !== 'number') raw.streak = 0;
        if (typeof raw.bestStreak !== 'number') raw.bestStreak = 0;
        return raw;
      } catch (e) { return emptyStats(); }
    }
    function persistStats(s) { try { localStorage.setItem(STATS_KEY, JSON.stringify(s)); } catch (e) {} }

    // ── App Store links (Esbro Labs) ──
    const APP_STORE_REVIEW_URL = 'https://apps.apple.com/app/id6760274286?action=write-review';
    const DEVELOPER_PAGE_URL = 'https://apps.apple.com/developer/esbro-labs-llc/id1883578468';
    const DEVELOPER_FALLBACK_URL = 'itms-apps://apps.apple.com/developer/esbro-labs-llc/id1883578468';
    function handleRateApp() {
      try {
        if (typeof Capacitor !== 'undefined' && Capacitor.Plugins.AppReview) { Capacitor.Plugins.AppReview.requestReview(); return; }
      } catch (e) {}
      try { window.open(APP_STORE_REVIEW_URL, '_blank'); } catch (e) {}
    }
    function handleMoreGames() {
      try { window.open(DEVELOPER_FALLBACK_URL, '_blank'); }
      catch (e) { try { window.open(DEVELOPER_PAGE_URL, '_blank'); } catch (e2) {} }
    }
    // House cross-promo: our Backgammon app (App Store id 6771981625).
    const BACKGAMMON_URL = 'https://apps.apple.com/app/id6771981625';
    const BACKGAMMON_FALLBACK_URL = 'itms-apps://apps.apple.com/app/id6771981625';
    function handlePlayBackgammon() {
      try { window.open(BACKGAMMON_FALLBACK_URL, '_blank'); }
      catch (e) { try { window.open(BACKGAMMON_URL, '_blank'); } catch (e2) {} }
    }

    // ── Animation easing (matches Backgammon) ──
    const REDUCED_MOTION = (() => { try { return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } })();
    const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);

    function Mancala() {
      const { w: windowWidth, h: windowHeight } = useWindowSize();
      const isLandscape = windowWidth > windowHeight;
      const scale = getScale(windowWidth);
      // Portrait stacks the stores above/below the pit grid, freeing the full
      // width for six pits, so the board can render noticeably larger.
      const bscale = isLandscape ? scale : Math.min(1.1, scale * 1.35);
      const [board, setBoard] = useState(initBoard());
      const [marbleMap, setMarbleMap] = useState(initMarbleMap);
      const [screen, setScreen] = useState("setup");
      const [currentPlayer, setCurrentPlayer] = useState(0);
      const [gameOver, setGameOver] = useState(false);
      const [message, setMessage] = useState("");
      const [cpuLevel, setCpuLevel] = useState(() => {
        try { const v = localStorage.getItem('mancalaCpuLevel'); return STATS_LEVELS.includes(v) ? v : 'sharp'; } catch (e) { return 'sharp'; }
      });
      const [goFirst, setGoFirst] = useState(() => {
        try { return localStorage.getItem('mancalaGoFirst') !== 'false'; } catch (e) { return true; }
      });
      const [training, setTraining] = useState(false);
      const [gameMode, setGameMode] = useState("cpu"); // 'cpu' | 'local' (pass & play)
      const [stats, setStats] = useState(loadStats);
      const [showStats, setShowStats] = useState(false);
      const [showOptions, setShowOptions] = useState(false);
      const [statsResetArmed, setStatsResetArmed] = useState(false);
      const [soundOn, setSoundOn] = useState(soundEnabled);
      const [skin, setSkin] = useState(() => {
        try { return localStorage.getItem('mancalaSkin') || 'ivory'; } catch (e) { return 'ivory'; }
      });
      useEffect(() => { try { document.body.style.background = getSkin(skin).bg1; } catch (e) {} }, [skin]);
      const [strategy, setStrategy] = useState(null);
      const [busy, setBusy] = useState(false);
      const [activePit, setActivePit] = useState(-1);
      const [stonesInHand, setStonesInHand] = useState(0);
      // Undo stack: stores { board, marbleMap, currentPlayer, message } snapshots
      const [undoStack, setUndoStack] = useState([]);
      const timerRef = useRef(null);
      const timersRef = useRef([]); // track all active timers for cleanup
      const mountedRef = useRef(true);
      // Bumped whenever the game state is rewound or replaced (new game, undo,
      // back to lobby). Async work captures the value before awaiting the worker
      // and bails if it changed, so a stale CPU move can never land on a fresh board.
      const genRef = useRef(0);
      const workerRef = useRef(null);
      const workerCallbacks = useRef({});
      const workerIdRef = useRef(0);
      // ── Animation geometry refs ──
      const boardWrapRef = useRef(null);   // position:relative anchor for overlay
      const pitRefs = useRef({});          // index -> pit/store circle DOM node
      const flyerRef = useRef(null);       // the single reusable flying-stone element
      const rafRef = useRef(null);         // active requestAnimationFrame id

      // ── Ads & IAP state ──
      const [adsRemoved, setAdsRemoved] = useState(() => {
        try { return localStorage.getItem('adsRemoved') === 'true'; } catch(e) { return false; }
      });
      const [adMobReady, setAdMobReady] = useState(false);
      const [interstitialLoaded, setInterstitialLoaded] = useState(false);
      const [iapProduct, setIapProduct] = useState(null);
      const [purchaseLoading, setPurchaseLoading] = useState(false);
      const [showPrePrompt, setShowPrePrompt] = useState(false);
      const prePromptResolveRef = useRef(null);

      // ── Web Worker lifecycle ──
      useEffect(() => {
        mountedRef.current = true;
        fbEnable(); // turn on Analytics + Crashlytics collection at startup
        workerRef.current = createAIWorker();
        workerRef.current.onmessage = (e) => {
          if (!mountedRef.current) return;
          const { id } = e.data;
          const cb = workerCallbacks.current[id];
          if (cb) { delete workerCallbacks.current[id]; cb(e.data); }
        };
        return () => {
          mountedRef.current = false;
          // Clear ALL timers on unmount
          if (timerRef.current) clearTimeout(timerRef.current);
          timersRef.current.forEach(t => clearTimeout(t));
          timersRef.current = [];
          if (rafRef.current) cancelAnimationFrame(rafRef.current);
          if (workerRef.current) workerRef.current.terminate();
        };
      }, []);

      const safeTimeout = (fn, ms) => {
        const id = setTimeout(() => {
          timersRef.current = timersRef.current.filter(t => t !== id);
          if (mountedRef.current) fn();
        }, ms);
        timersRef.current.push(id);
        timerRef.current = id;
        return id;
      };

      // ── AdMob initialization ──
      useEffect(() => {
        if (adsRemoved) return;
        const initAds = async () => {
          try {
            if (typeof Capacitor === 'undefined') return;
            const { AdMob } = Capacitor.Plugins;
            if (!AdMob) return;
            await AdMob.initialize();
            // Best-effort ATT + consent (don't block ads on result)
            try {
              const trackStatus = await AdMob.trackingAuthorizationStatus();
              if (trackStatus.status === 'notDetermined') {
                const userAccepted = await new Promise(resolve => {
                  prePromptResolveRef.current = resolve;
                  setShowPrePrompt(true);
                });
                if (userAccepted) {
                  await AdMob.requestTrackingAuthorization();
                }
              }
              const consent = await AdMob.requestConsentInfo();
              if (consent.isConsentFormAvailable && consent.status === 'REQUIRED') {
                await AdMob.showConsentForm();
              }
            } catch (consentErr) { console.warn('Consent flow:', consentErr); }
            setAdMobReady(true);
            await AdMob.prepareInterstitial({ adId: 'ca-app-pub-9690726274194822/6499562065' });
            setInterstitialLoaded(true);
          } catch (err) { console.error('Ad init:', err); }
        };
        initAds();
      }, [adsRemoved]);

      // ── Banner ad lifecycle ──
      useEffect(() => {
        if (adsRemoved || !adMobReady || typeof Capacitor === 'undefined') return;
        const { AdMob } = Capacitor.Plugins;
        if (!AdMob) return;
        AdMob.showBanner({
          adId: 'ca-app-pub-9690726274194822/5102719911',
          adSize: 'BANNER',
          position: 'BOTTOM_CENTER',
          margin: 0,
        }).catch(() => {});
        return () => { AdMob.hideBanner().catch(() => {}); };
      }, [adsRemoved, adMobReady]);

      // ── IAP product loading ──
      useEffect(() => {
        const loadProduct = async () => {
          try {
            if (typeof Capacitor === 'undefined') return;
            const { NativePurchases } = Capacitor.Plugins;
            if (!NativePurchases) return;
            const products = await NativePurchases.getProducts({
              productIdentifiers: ['com.esbrolabs.mancala.removeads'],
              productType: 'INAPP',
            });
            if (products && products.products && products.products.length > 0) {
              setIapProduct(products.products[0]);
            }
          } catch (err) { console.error('IAP load:', err); }
        };
        loadProduct();
      }, []);

      const postWorker = (msg) => {
        return new Promise((resolve) => {
          const id = ++workerIdRef.current;
          workerCallbacks.current[id] = resolve;
          workerRef.current.postMessage({ ...msg, id });
        });
      };

      const clearTimer = () => {
        if (timerRef.current) { clearTimeout(timerRef.current); timerRef.current = null; }
        timersRef.current.forEach(t => clearTimeout(t));
        timersRef.current = [];
        if (rafRef.current) { cancelAnimationFrame(rafRef.current); rafRef.current = null; }
        if (flyerRef.current) flyerRef.current.style.display = "none";
      };

      const startGame = async (isTraining, overrideGoFirst, mode) => {
        clearTimer();
        genRef.current += 1;
        const gen = genRef.current;
        sndInit(); // user gesture: unlock audio for the whole game
        const nextMode = mode || "cpu";
        fbLogEvent('game_start', { mode: nextMode, difficulty: cpuLevel, training: isTraining ? 1 : 0 });
        const cpuFirst = nextMode === "cpu" && (overrideGoFirst !== undefined ? !overrideGoFirst : !goFirst);
        const b = initBoard();
        const mm = initMarbleMap();
        _marbleIdCounter = 0; clearMarbleOffsets(); // reset for clean game
        setBoard(b); setMarbleMap(mm); setCurrentPlayer(0); setGameOver(false);
        setBusy(false); setActivePit(-1); setStonesInHand(0);
        setUndoStack([]);
        setTraining(isTraining);
        setGameMode(nextMode);
        setStrategy(null);
        setScreen("game");
        if (nextMode === "local") {
          setMessage("Pass & Play - Player 1 starts. Tap a pit!");
          return;
        }
        const cpuOpens = () => {
          setCurrentPlayer(1);
          setMessage("CPU goes first... thinking...");
          safeTimeout(async () => {
            if (!mountedRef.current || gen !== genRef.current) return;
            const data = await postWorker({ type: "cpuMove", board: b, player: 1, level: cpuLevel });
            if (!mountedRef.current || gen !== genRef.current) return;
            const cp = data.move;
            if (cp >= 0) animateSow(b, mm, cp, 1, (fb2, et2, mm2) => finishMove(fb2, et2, 1, cp, isTraining, cpuLevel, "cpu", mm2));
          }, 500);
        };
        if (isTraining) {
          setMessage("Training Mode - computing strategy...");
          if (cpuFirst) {
            cpuOpens();
          } else {
            const data = await postWorker({ type: "strategy", board: b, player: 0 });
            if (mountedRef.current && gen === genRef.current) {
              setStrategy(data.result);
              setMessage("Training Mode - tap a pit. Strategy shown below.");
            }
          }
        } else {
          if (cpuFirst) {
            cpuOpens();
          } else {
            setMessage("Your turn! Tap a pit to sow stones.");
          }
        }
      };

      // Center of a pit/store circle, in coords relative to the board overlay anchor.
      const pitCenter = (idx) => {
        const node = pitRefs.current[idx];
        const wrap = boardWrapRef.current;
        if (!node || !wrap) return null;
        const r = node.getBoundingClientRect();
        const w = wrap.getBoundingClientRect();
        return { x: r.left - w.left + r.width / 2, y: r.top - w.top + r.height / 2 };
      };

      // Animate the single reusable flyer from -> to along a cubic-eased arc with a
      // sin(t*PI) lift. Runs entirely off React via requestAnimationFrame. Calls onDone
      // when it lands. Falls back to an immediate onDone if geometry is unavailable.
      const flyStone = (from, to, opts, onDone) => {
        const el = flyerRef.current;
        const dur = (opts && opts.dur) || 150;
        const liftPx = (opts && opts.lift) != null ? opts.lift : 22 * bscale;
        const sz = (opts && opts.size) || Math.round(17 * bscale);
        if (!el || !from || !to || REDUCED_MOTION) { if (onDone) onDone(); return; }
        el.style.width = sz + "px"; el.style.height = sz + "px";
        el.style.display = "block";
        const start = performance.now();
        let done = false;
        let watchdog = null;
        const settle = () => {
          if (done) return; done = true;
          if (rafRef.current) { cancelAnimationFrame(rafRef.current); rafRef.current = null; }
          if (watchdog) { clearTimeout(watchdog); watchdog = null; }
          el.style.display = "none";
          if (onDone) onDone();
        };
        const tick = (now) => {
          if (done) return;
          if (!mountedRef.current) { el.style.display = "none"; return; }
          const t = Math.min(1, (now - start) / dur);
          const e = easeOutCubic(t);
          const L = Math.sin(t * Math.PI);
          const x = from.x + (to.x - from.x) * e;
          const y = from.y + (to.y - from.y) * e - L * liftPx;
          const s = 1 + L * 0.12;
          el.style.transform = "translate3d(" + (x - sz / 2) + "px," + (y - sz / 2) + "px,0) scale(" + s + ")";
          if (t < 1) { rafRef.current = requestAnimationFrame(tick); }
          else { settle(); }
        };
        // Position immediately at the start point, then begin the loop next frame.
        el.style.transform = "translate3d(" + (from.x - sz / 2) + "px," + (from.y - sz / 2) + "px,0) scale(1)";
        if (rafRef.current) cancelAnimationFrame(rafRef.current);
        rafRef.current = requestAnimationFrame(tick);
        // Watchdog: if rAF is paused (app backgrounded / tab hidden), settle anyway so a
        // move can never stall in the "busy" state. Cleared on normal completion.
        watchdog = safeTimeout(settle, dur + 200);
      };

      const animateSow = useCallback((b, mm, pit, player, onComplete) => {
        const { finalBoard, extraTurn, sequence, captured } = sowResult(b, pit, player);
        setBusy(true);

        // Working copies we mutate as stones land (shallow per-pit, no deep JSON clones).
        const animBoard = [...b];
        animBoard[pit] = 0;
        const animMM = {};
        for (let i = 0; i < 14; i++) animMM[i] = [...(mm[i] || [])];
        const movingMarbles = animMM[pit].splice(0);

        // Empty the source pit immediately.
        setBoard([...animBoard]);
        setMarbleMap({ ...animMM });
        setActivePit(pit);
        setStonesInHand(sequence.length);

        const finishCapture = () => {
          const finalMM = updateMarbleMap(mm, b, finalBoard, sequence, pit, captured, player);
          setBoard([...finalBoard]);
          setMarbleMap(finalMM);
          setActivePit(player === 0 ? 6 : 13);
          setStonesInHand(0);
          hapticMedium();
          sfxCapture();
          safeTimeout(() => {
            if (!mountedRef.current) return;
            setActivePit(-1); setBusy(false);
            if (onComplete) onComplete(finalBoard, extraTurn, finalMM);
          }, 300);
        };

        const finishPlain = () => {
          const finalMM = updateMarbleMap(mm, b, finalBoard, sequence, pit, captured, player);
          setMarbleMap(finalMM);
          setActivePit(-1); setStonesInHand(0); setBusy(false);
          if (onComplete) onComplete(finalBoard, extraTurn, finalMM);
        };

        // Reduced-motion / no-geometry fallback: settle instantly (preserves behavior).
        if (REDUCED_MOTION || !boardWrapRef.current) {
          if (captured > 0) { safeTimeout(finishCapture, 120); }
          else { finishPlain(); }
          return;
        }

        // Hop-along sweep: one flyer travels source -> target[0] -> target[1] -> ...,
        // depositing a stone (and firing a light haptic) at each pit it passes.
        let step = 0;
        const hopNext = () => {
          if (!mountedRef.current) return;
          if (step >= sequence.length) {
            if (captured > 0) {
              // Sweep the captured stones into the store with a longer arc.
              const from = pitCenter(sequence[sequence.length - 1]) || pitCenter(pit);
              const to = pitCenter(player === 0 ? 6 : 13);
              flyStone(from, to, { dur: 280, lift: 40 * bscale }, () => {
                if (!mountedRef.current) return;
                finishCapture();
              });
            } else {
              finishPlain();
            }
            return;
          }
          const target = sequence[step];
          const from = step === 0 ? pitCenter(pit) : pitCenter(sequence[step - 1]);
          const to = pitCenter(target);
          flyStone(from, to, { dur: 150 }, () => {
            if (!mountedRef.current) return;
            // Deposit the stone now that it has landed.
            animBoard[target]++;
            if (step < movingMarbles.length) animMM[target] = [...animMM[target], movingMarbles[step]];
            else animMM[target] = [...animMM[target], generateMarbleIds(1)[0]];
            setBoard([...animBoard]);
            setMarbleMap({ ...animMM });
            setActivePit(target);
            setStonesInHand(sequence.length - step - 1);
            hapticLight();
            sfxDrop();
            step++;
            hopNext();
          });
        };
        safeTimeout(hopNext, 120);
      }, [bscale]);

      const recordResult = (level, w) => {
        setStats(prev => {
          const s = JSON.parse(JSON.stringify(prev));
          if (!s.levels[level]) s.levels[level] = { w: 0, l: 0, t: 0 };
          if (w === 0) {
            s.levels[level].w += 1;
            s.streak += 1;
            if (s.streak > s.bestStreak) s.bestStreak = s.streak;
          } else if (w === 1) {
            s.levels[level].l += 1;
            s.streak = 0;
          } else {
            s.levels[level].t += 1;
            s.streak = 0;
          }
          persistStats(s);
          return s;
        });
      };

      const finishMove = useCallback((fb, extraTurn, player, pit, isTraining, level, mode, mm) => {
        if (!mountedRef.current) return;
        const gen = genRef.current;
        const local = mode === "local";
        const pitLabel = player === 0 ? pit + 1 : pit - 6;
        const name = player === 0 ? (local ? "Player 1" : "You") : (local ? "Player 2" : "CPU");
        const otherName = player === 0 ? (local ? "Player 2" : "CPU") : (local ? "Player 1" : "You");
        if (isGameOver(fb)) {
          const fin = finalizeBoard(fb);
          // Update marble map for finalized board
          const finMM = {};
          for (let i = 0; i < 14; i++) finMM[i] = [...(mm[i] || [])];
          for (let i = 0; i < 6; i++) { finMM[6].push(...finMM[i]); finMM[i] = []; }
          for (let i = 7; i < 13; i++) { finMM[13].push(...finMM[i]); finMM[i] = []; }
          // Sync counts
          for (let i = 0; i < 14; i++) {
            while (finMM[i].length < fin[i]) finMM[i].push(generateMarbleIds(1)[0]);
            while (finMM[i].length > fin[i]) finMM[i].pop();
          }
          setBoard(fin); setMarbleMap(finMM); setGameOver(true);
          const w = getWinner(fin);
          fbLogEvent('game_complete', {
            mode: mode, difficulty: level, training: isTraining ? 1 : 0,
            result: w === 0 ? 'p1_win' : w === 1 ? 'p2_win' : 'tie',
            score_p1: fin[6], score_p2: fin[13],
          });
          const wm = local
            ? (w === 0 ? "Player 1 wins!" : w === 1 ? "Player 2 wins!" : "It's a tie!")
            : (w === 0 ? "You win!" : w === 1 ? "CPU wins!" : "It's a tie!");
          setMessage("Game Over - " + wm + " (" + fin[6] + " vs " + fin[13] + ")");
          setStrategy(null);
          if (local) {
            if (w === -1) sfxTie(); else sfxWin();
            hapticHeavy();
          } else {
            if (w === 0) { sfxWin(); hapticHeavy(); }
            else if (w === 1) { sfxLose(); hapticMedium(); }
            else { sfxTie(); hapticMedium(); }
            if (!isTraining) recordResult(level, w);
          }
          // Review prompt after the 3rd completed game (Apple rate-limits to ~3/year anyway)
          try {
            const gc = parseInt(localStorage.getItem('gamesCompleted') || '0', 10) + 1;
            localStorage.setItem('gamesCompleted', String(gc));
            if (gc === 3 && typeof Capacitor !== 'undefined') {
              safeTimeout(() => {
                const { AppReview } = Capacitor.Plugins;
                if (AppReview) AppReview.requestReview();
              }, 1800);
            }
          } catch (e) { /* ignore in browser */ }
          return;
        }

        if (extraTurn) sfxExtra();

        // Pass & play: no CPU, just hand the turn across the table.
        if (local) {
          if (extraTurn) {
            setMessage(name + " played pit " + pitLabel + " - Extra turn!");
            setCurrentPlayer(player);
          } else {
            setMessage(name + " played pit " + pitLabel + ". " + otherName + "'s turn!");
            setCurrentPlayer(1 - player);
          }
          return;
        }

        const doCpuTurn = (currentBoard, marbles, lvl, delay) => {
          setMessage((player === 0 ? "You played pit " + pitLabel + ". " : name + " played pit " + pitLabel + " - Extra turn! ") + "CPU thinking...");
          safeTimeout(async () => {
            if (!mountedRef.current || gen !== genRef.current) return;
            const data = await postWorker({ type: "cpuMove", board: currentBoard, player: 1, level: lvl });
            if (!mountedRef.current || gen !== genRef.current) return;
            const cp = data.move;
            if (cp >= 0) animateSow(currentBoard, marbles, cp, 1, (fb2, et2, mm2) => finishMove(fb2, et2, 1, cp, isTraining, level, mode, mm2));
          }, delay);
        };

        if (extraTurn) {
          setMessage(name + " played pit " + pitLabel + " - Extra turn!");
          if (player === 0) {
            setCurrentPlayer(0);
            if (isTraining) {
              postWorker({ type: "strategy", board: fb, player: 0 }).then(data => {
                if (mountedRef.current && gen === genRef.current) setStrategy(data.result);
              });
            }
          } else {
            setCurrentPlayer(1);
            doCpuTurn(fb, mm, level, 600);
          }
        } else if (player === 0) {
          setCurrentPlayer(1);
          doCpuTurn(fb, mm, level, isTraining ? 500 : 800);
        } else {
          setMessage("CPU played pit " + pitLabel + ". Your turn!");
          setCurrentPlayer(0);
          if (isTraining) {
            postWorker({ type: "strategy", board: fb, player: 0 }).then(data => {
              if (mountedRef.current && gen === genRef.current) setStrategy(data.result);
            });
          }
        }
      }, [animateSow]);

      const handlePitClick = (pit) => {
        if (gameOver || busy) return;
        if (gameMode === "cpu" && currentPlayer !== 0) return;
        // Each player may only sow from their own row (P1: 0-5, P2: 7-12).
        const lo = currentPlayer === 0 ? 0 : 7;
        if (pit < lo || pit > lo + 5 || board[pit] === 0) return;
        sndInit(); // user gesture: keep audio unlocked
        // Save undo snapshot before the move (undo exists in training mode only)
        if (training) {
          setUndoStack(prev => [...prev, {
            board: [...board],
            marbleMap: JSON.parse(JSON.stringify(marbleMap)),
            currentPlayer,
            message,
            strategy,
          }]);
        }
        setStrategy(null);
        const pl = currentPlayer;
        animateSow(board, marbleMap, pit, pl, (fb, et, mm) => finishMove(fb, et, pl, pit, training, cpuLevel, gameMode, mm));
      };

      const handleUndo = () => {
        if (undoStack.length === 0 || busy || !training) return;
        clearTimer();
        genRef.current += 1; // invalidate any CPU move already in flight
        const gen = genRef.current;
        const prev = undoStack[undoStack.length - 1];
        setUndoStack(s => s.slice(0, -1));
        setBoard(prev.board);
        setMarbleMap(prev.marbleMap);
        setCurrentPlayer(prev.currentPlayer);
        setMessage(prev.message);
        setStrategy(prev.strategy);
        setGameOver(false);
        setBusy(false);
        setActivePit(-1);
        setStonesInHand(0);
        // Recompute strategy
        if (prev.currentPlayer === 0) {
          postWorker({ type: "strategy", board: prev.board, player: 0 }).then(data => {
            if (mountedRef.current && gen === genRef.current) setStrategy(data.result);
          });
        }
      };

      const backToSetup = async () => {
        clearTimer();
        genRef.current += 1; // invalidate any CPU move already in flight
        if (!adsRemoved && interstitialLoaded && typeof Capacitor !== 'undefined') {
          try {
            const { AdMob } = Capacitor.Plugins;
            if (AdMob) {
              await AdMob.showInterstitial();
              AdMob.prepareInterstitial({ adId: 'ca-app-pub-9690726274194822/6499562065' })
                .then(() => setInterstitialLoaded(true))
                .catch(() => setInterstitialLoaded(false));
            }
          } catch (err) { console.error('Interstitial:', err); }
        }
        setScreen("setup");
      };

      // ── Play Again (with interstitial) ──
      const handlePlayAgain = async () => {
        let next;
        if (gameMode === "cpu") {
          // Alternate who opens each rematch
          next = !goFirst;
          setGoFirst(next);
          try { localStorage.setItem('mancalaGoFirst', String(next)); } catch (e) {}
        }
        if (!adsRemoved && interstitialLoaded) {
          try {
            const { AdMob } = Capacitor.Plugins;
            if (AdMob) {
              await AdMob.showInterstitial();
              AdMob.prepareInterstitial({ adId: 'ca-app-pub-9690726274194822/6499562065' })
                .then(() => setInterstitialLoaded(true))
                .catch(() => setInterstitialLoaded(false));
            }
          } catch (err) { console.error('Interstitial:', err); }
        }
        startGame(training, next, gameMode);
      };

      // ── Remove Ads purchase ──
      const handleRemoveAds = async () => {
        if (purchaseLoading || !iapProduct) return;
        setPurchaseLoading(true);
        try {
          const { NativePurchases } = Capacitor.Plugins;
          await NativePurchases.purchaseProduct({
            productIdentifier: 'com.esbrolabs.mancala.removeads',
            productType: 'INAPP',
            quantity: 1,
          });
          localStorage.setItem('adsRemoved', 'true');
          setAdsRemoved(true);
          fbLogEvent('remove_ads_purchase', {});
          try { const { AdMob } = Capacitor.Plugins; if (AdMob) await AdMob.removeBanner(); } catch(e) {}
        } catch (err) { console.error('Purchase:', err); }
        finally { setPurchaseLoading(false); }
      };

      // ── Restore Purchases ──
      const handleRestorePurchases = async () => {
        if (purchaseLoading) return;
        setPurchaseLoading(true);
        try {
          const { NativePurchases } = Capacitor.Plugins;
          // restorePurchases() returns void; the owned purchases come from getPurchases().
          await NativePurchases.restorePurchases();
          const res = await NativePurchases.getPurchases();
          const purchases = (res && res.purchases) || [];
          if (purchases.some(t => t.productIdentifier === 'com.esbrolabs.mancala.removeads')) {
            localStorage.setItem('adsRemoved', 'true');
            setAdsRemoved(true);
            try { const { AdMob } = Capacitor.Plugins; if (AdMob) await AdMob.removeBanner(); } catch(e) {}
          }
        } catch (err) { console.error('Restore:', err); }
        finally { setPurchaseLoading(false); }
      };

      const sk = getSkin(skin);
      const changeSkin = (k) => { setSkin(k); try { localStorage.setItem('mancalaSkin', k); } catch (e) {} };
      const changeCpuLevel = (lv) => { setCpuLevel(lv); try { localStorage.setItem('mancalaCpuLevel', lv); } catch (e) {} };
      const changeGoFirst = (val) => { setGoFirst(val); try { localStorage.setItem('mancalaGoFirst', String(val)); } catch (e) {} };
      const toggleSound = () => {
        const next = !soundOn;
        setSoundOn(next);
        setSoundEnabled(next);
        if (next) sfxDrop(); // audible feedback that sound is back on
      };
      const closeStats = () => { setShowStats(false); setStatsResetArmed(false); };
      const handleStatsReset = () => {
        if (!statsResetArmed) { setStatsResetArmed(true); return; }
        const s = emptyStats();
        persistStats(s);
        setStats(s);
        setStatsResetArmed(false);
      };

      // Persistent house cross-promo for our Backgammon app (shown to everyone).
      const renderPromo = () => (
        <div onClick={handlePlayBackgammon} style={{
          maxWidth: 460, width: "100%", marginTop: 12, cursor: "pointer",
          background: sk.panel, border: "1px solid " + sk.panelBorder, borderRadius: 14,
          padding: 10, display: "flex", alignItems: "center", gap: 12,
          boxShadow: "0 6px 24px rgba(0,0,0,0.35)",
        }}>
          <img src="backgammon-icon.png" alt="Backgammon" width="52" height="52" style={{ borderRadius: 12, flexShrink: 0, boxShadow: "0 2px 6px rgba(0,0,0,0.4)" }} />
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{ fontSize: 9, color: sk.textDim, letterSpacing: 1, textTransform: "uppercase" }}>Also by Esbro Labs</div>
            <div style={{ fontSize: 16, fontWeight: "bold", color: sk.accent }}>Backgammon</div>
            <div style={{ fontSize: 11, color: sk.textDim }}>Classic dice strategy. Free.</div>
          </div>
          <div style={{ flexShrink: 0, padding: "7px 16px", borderRadius: 20, background: sk.btnActive, color: sk.accentText, fontSize: 12, fontWeight: "bold", letterSpacing: 1 }}>GET</div>
        </div>
      );

      // ATT/consent pre-prompt overlay, rendered regardless of screen so the
      // awaited promise in initAds can never be orphaned if the user taps PLAY
      // before it appears (which would otherwise hang ad init for the session).
      const prePromptOverlay = showPrePrompt ? (
        <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.7)", zIndex: 9999, display: "flex", alignItems: "center", justifyContent: "center" }}>
          <div style={{ background: "linear-gradient(145deg, " + sk.bg2 + ", " + sk.bg1 + ")", borderRadius: 16, padding: "28px 24px", maxWidth: 320, width: "90%", border: "2px solid " + sk.boardBorder, textAlign: "center", fontFamily: "'Georgia', serif" }}>
            <div style={{ fontSize: 18, fontWeight: "bold", color: sk.accent, marginBottom: 12 }}>Mancala is supported by ads</div>
            <div style={{ fontSize: 14, color: sk.text, lineHeight: 1.6, marginBottom: 20 }}>Allowing tracking helps keep the game free by showing more relevant ads.</div>
            <div style={{ display: "flex", gap: 10, justifyContent: "center" }}>
              <button onClick={() => { setShowPrePrompt(false); prePromptResolveRef.current?.(false); }} style={{ padding: "10px 20px", borderRadius: 8, border: "1px solid " + sk.panelBorder, background: sk.btnPassive, color: sk.textDim, fontSize: 14, cursor: "pointer", fontFamily: "'Georgia', serif" }}>Not Now</button>
              <button onClick={() => { setShowPrePrompt(false); prePromptResolveRef.current?.(true); }} style={{ padding: "10px 20px", borderRadius: 8, border: "none", background: sk.btnActive, color: sk.accentText, fontWeight: "bold", fontSize: 14, cursor: "pointer", fontFamily: "'Georgia', serif" }}>Continue</button>
            </div>
          </div>
        </div>
      ) : null;

      if (screen === "setup") {
        const totalGames = STATS_LEVELS.reduce((n, lv) => { const r = stats.levels[lv]; return n + r.w + r.l + r.t; }, 0);
        return (
          // No justifyContent:center here: with overflow the top half would be
          // clipped and unreachable. The inner margin:auto wrapper centers when
          // there is room and top-aligns scrollably when there is not.
          <div style={{ height: "100%", background: "linear-gradient(145deg, " + sk.bg1 + " 0%, " + sk.bg2 + " 50%, " + sk.bg1 + " 100%)", fontFamily: "'Georgia', 'Times New Roman', serif", color: sk.text, display: "flex", flexDirection: "column", alignItems: "center", padding: "12px 16px", overflowY: "auto" }}>
            <div style={{ margin: "auto", display: "flex", flexDirection: "column", alignItems: "center", width: "100%" }}>
            <div style={{ textAlign: "center", marginBottom: 8 }}>
              <h1 style={{ fontSize: "min(9vw, 38px)", fontWeight: "bold", color: sk.accent, textShadow: sk.titleShadow, letterSpacing: 4, margin: 0 }}>MANCALA</h1>
              <p style={{ color: sk.textDim, fontSize: 12, marginTop: 2, letterSpacing: 3 }}>STONE STRATEGY</p>
            </div>
            <div style={{ background: sk.panel, border: "1px solid " + sk.panelBorder, borderRadius: 16, padding: 16, maxWidth: 460, width: "100%", boxShadow: "0 10px 40px rgba(0,0,0,0.5)" }}>
              <div style={{ marginBottom: 12 }}>
                <label style={{ display: "block", marginBottom: 6, color: sk.accent, fontSize: 12, letterSpacing: 1 }}>CPU DIFFICULTY</label>
                <div style={{ display: "flex", gap: 4 }}>
                  {["rookie", "sharp", "counter"].map(lv => (
                    <button key={lv} onClick={() => changeCpuLevel(lv)} style={{
                      flex: 1, padding: "9px 4px", borderRadius: 8, border: "none",
                      background: cpuLevel === lv ? sk.btnActive : sk.btnPassive,
                      color: cpuLevel === lv ? sk.accentText : CPU_CLR[lv],
                      fontWeight: "bold", fontSize: 12, cursor: "pointer", fontFamily: "'Georgia', serif",
                      textTransform: "uppercase", letterSpacing: 1,
                    }}>{CPU_LABELS[lv]}</button>
                  ))}
                </div>
              </div>
              <button onClick={() => startGame(false)} style={{ width: "100%", padding: "14px", borderRadius: 10, border: "none", background: sk.btnActive, color: sk.accentText, fontWeight: "bold", fontSize: 20, cursor: "pointer", fontFamily: "'Georgia', serif", letterSpacing: 2, boxShadow: "0 4px 20px rgba(0,0,0,0.25)" }}>PLAY</button>
              <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
                <button onClick={() => startGame(false, undefined, "local")} style={{ flex: 1, padding: "9px 4px", borderRadius: 10, border: "1px solid #e67e22", background: "rgba(230,126,34,0.12)", color: "#e67e22", fontWeight: "bold", fontSize: 13, cursor: "pointer", fontFamily: "'Georgia', serif", letterSpacing: 1, lineHeight: 1.2 }}>2 PLAYERS<br/><span style={{ fontSize: 9, fontWeight: "normal", opacity: 0.85, letterSpacing: 0.5 }}>(Pass &amp; Play)</span></button>
                <button onClick={() => startGame(true)} style={{ flex: 1, padding: "9px 4px", borderRadius: 10, border: "1px solid #3498db", background: "rgba(52,152,219,0.12)", color: "#3498db", fontWeight: "bold", fontSize: 13, cursor: "pointer", fontFamily: "'Georgia', serif", letterSpacing: 1, lineHeight: 1.2 }}>TRAINING<br/><span style={{ fontSize: 9, fontWeight: "normal", opacity: 0.85, letterSpacing: 0.5 }}>(With Hints)</span></button>
              </div>
              <div style={{ display: "flex", gap: 8, justifyContent: "center", marginTop: 10 }}>
                <button onClick={() => setShowOptions(true)} style={{ flex: 1, padding: "9px 4px", borderRadius: 8, border: "1px solid " + sk.panelBorder, background: "rgba(0,0,0,0.12)", color: sk.accent, fontSize: 12, cursor: "pointer", fontFamily: "'Georgia', serif", letterSpacing: 1 }}>OPTIONS</button>
                <button onClick={() => setShowStats(true)} style={{ flex: 1, padding: "9px 4px", borderRadius: 8, border: "1px solid " + sk.panelBorder, background: "rgba(0,0,0,0.12)", color: sk.accent, fontSize: 12, cursor: "pointer", fontFamily: "'Georgia', serif", letterSpacing: 1 }}>STATS</button>
              </div>
            </div>
            {renderPromo()}
            </div>
            {!adsRemoved && adMobReady && <div style={{ minHeight: 80, flexShrink: 0 }} />}
            {showOptions && (
              <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.7)", zIndex: 9998, display: "flex", alignItems: "center", justifyContent: "center" }}>
                <div style={{ background: "linear-gradient(145deg, " + sk.bg2 + ", " + sk.bg1 + ")", borderRadius: 16, padding: "20px 20px 16px", maxWidth: 360, width: "92%", border: "2px solid " + sk.boardBorder, fontFamily: "'Georgia', serif", maxHeight: "88%", overflowY: "auto" }}>
                  <div style={{ fontSize: 17, fontWeight: "bold", color: sk.accent, marginBottom: 14, textAlign: "center", letterSpacing: 2 }}>OPTIONS</div>

                  <label style={{ display: "block", marginBottom: 6, color: sk.accent, fontSize: 12, letterSpacing: 1 }}>THEME</label>
                  <div style={{ display: "flex", gap: 12, marginBottom: 14, justifyContent: "center" }}>
                    {SKIN_KEYS.map(k => {
                      const s = SKINS[k]; const active = skin === k;
                      return <div key={k} onClick={() => changeSkin(k)} title={s.name} style={{
                        width: 34, height: 34, borderRadius: "50%", cursor: "pointer", background: s.swatch,
                        border: active ? "3px solid " + sk.accent : "2px solid rgba(255,255,255,0.18)",
                        boxShadow: active ? "0 0 10px " + sk.accent + "88" : "0 1px 3px rgba(0,0,0,0.4)",
                      }} />;
                    })}
                  </div>

                  <label style={{ display: "block", marginBottom: 6, color: sk.accent, fontSize: 12, letterSpacing: 1 }}>TURN ORDER</label>
                  <div style={{ display: "flex", gap: 4, marginBottom: 14 }}>
                    {[true, false].map(val => (
                      <button key={String(val)} onClick={() => changeGoFirst(val)} style={{
                        flex: 1, padding: "9px 4px", borderRadius: 8, border: "none",
                        background: goFirst === val ? sk.btnActive : sk.btnPassive,
                        color: goFirst === val ? sk.accentText : sk.text,
                        fontWeight: "bold", fontSize: 12, cursor: "pointer", fontFamily: "'Georgia', serif",
                      }}>{val ? "Go First" : "Go Second"}</button>
                    ))}
                  </div>

                  <label style={{ display: "block", marginBottom: 6, color: sk.accent, fontSize: 12, letterSpacing: 1 }}>SOUND</label>
                  <button onClick={toggleSound} style={{ width: "100%", padding: "9px 4px", borderRadius: 8, border: "none", background: soundOn ? sk.btnActive : sk.btnPassive, color: soundOn ? sk.accentText : sk.text, fontWeight: "bold", fontSize: 12, cursor: "pointer", fontFamily: "'Georgia', serif", marginBottom: 14 }}>
                    {soundOn ? "Sound On" : "Sound Off"}
                  </button>

                  {!adsRemoved && iapProduct && (
                    <button onClick={handleRemoveAds} disabled={purchaseLoading} style={{ width: "100%", padding: "11px", borderRadius: 10, border: "1px solid #27ae60", background: purchaseLoading ? "rgba(39,174,96,0.05)" : "rgba(39,174,96,0.12)", color: "#27ae60", fontWeight: "bold", fontSize: 13, cursor: purchaseLoading ? "default" : "pointer", fontFamily: "'Georgia', serif", letterSpacing: 1, marginBottom: 8, opacity: purchaseLoading ? 0.6 : 1 }}>
                      {purchaseLoading ? "PROCESSING..." : "REMOVE ADS - " + iapProduct.priceString}
                    </button>
                  )}
                  {adsRemoved && (
                    <div style={{ width: "100%", padding: "8px", textAlign: "center", color: "#27ae60", fontSize: 12, marginBottom: 8, fontFamily: "'Georgia', serif" }}>Ads Removed</div>
                  )}

                  <div style={{ display: "flex", gap: 8, marginBottom: 10 }}>
                    <button onClick={handleRateApp} style={{ flex: 1, padding: "9px 4px", borderRadius: 8, border: "1px solid " + sk.panelBorder, background: "rgba(0,0,0,0.12)", color: sk.accent, fontSize: 12, cursor: "pointer", fontFamily: "'Georgia', serif", letterSpacing: 1 }}>Rate App</button>
                    <button onClick={handleMoreGames} style={{ flex: 1, padding: "9px 4px", borderRadius: 8, border: "1px solid " + sk.panelBorder, background: "rgba(0,0,0,0.12)", color: sk.accent, fontSize: 12, cursor: "pointer", fontFamily: "'Georgia', serif", letterSpacing: 1 }}>More Games</button>
                  </div>
                  {!adsRemoved && (
                    <button onClick={handleRestorePurchases} disabled={purchaseLoading} style={{ width: "100%", padding: "6px", borderRadius: 10, border: "none", background: "transparent", color: sk.textDim, fontSize: 11, cursor: purchaseLoading ? "default" : "pointer", fontFamily: "'Georgia', serif", letterSpacing: 1, marginBottom: 8, textDecoration: "underline" }}>Restore Purchases</button>
                  )}

                  <div style={{ marginTop: 4, marginBottom: 14, fontSize: 11.5, color: sk.textDim, lineHeight: 1.5, textAlign: "center" }}>
                    <strong style={{ color: sk.accent }}>CPU:</strong> <span style={{ color: CPU_CLR.rookie }}>Rookie</span> casual · <span style={{ color: CPU_CLR.sharp }}>Sharp</span> hunts captures · <span style={{ color: CPU_CLR.counter }}>Counter</span> thinks deep.<br/>
                    <strong style={{ color: sk.accent }}>How to play:</strong> Sow counter-clockwise. Land in your store = extra turn. Empty pit on your side = capture. Most stones wins.
                  </div>

                  <button onClick={() => setShowOptions(false)} style={{ width: "100%", padding: "11px", borderRadius: 10, border: "none", background: sk.btnActive, color: sk.accentText, fontWeight: "bold", fontSize: 14, cursor: "pointer", fontFamily: "'Georgia', serif", letterSpacing: 1 }}>CLOSE</button>
                </div>
              </div>
            )}
            {showStats && (
              <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.7)", zIndex: 9998, display: "flex", alignItems: "center", justifyContent: "center" }}>
                <div style={{ background: "linear-gradient(145deg, " + sk.bg2 + ", " + sk.bg1 + ")", borderRadius: 16, padding: "22px 22px 16px", maxWidth: 340, width: "90%", border: "2px solid " + sk.boardBorder, fontFamily: "'Georgia', serif", maxHeight: "85%", overflowY: "auto" }}>
                  <div style={{ fontSize: 17, fontWeight: "bold", color: sk.accent, marginBottom: 4, textAlign: "center", letterSpacing: 2 }}>YOUR RECORD</div>
                  <div style={{ fontSize: 10, color: sk.textDim, textAlign: "center", marginBottom: 14 }}>Standard games vs CPU</div>
                  {STATS_LEVELS.map(lv => {
                    const r = stats.levels[lv];
                    const tot = r.w + r.l + r.t;
                    const pct = tot > 0 ? Math.round((r.w / tot) * 100) : null;
                    return (
                      <div key={lv} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "7px 4px", borderBottom: "1px solid rgba(255,255,255,0.07)" }}>
                        <span style={{ color: CPU_CLR[lv], fontWeight: "bold", fontSize: 14 }}>{CPU_LABELS[lv]}</span>
                        <span style={{ color: sk.text, fontSize: 13 }}>
                          {r.w}W - {r.l}L - {r.t}T
                          <span style={{ color: sk.textDim, fontSize: 11, marginLeft: 6 }}>{pct === null ? "no games" : pct + "% wins"}</span>
                        </span>
                      </div>
                    );
                  })}
                  <div style={{ display: "flex", justifyContent: "space-between", padding: "10px 4px 4px", fontSize: 12.5, color: sk.text }}>
                    <span>Win streak: <strong style={{ color: "#4CAF50" }}>{stats.streak}</strong></span>
                    <span>Best: <strong style={{ color: sk.accent }}>{stats.bestStreak}</strong></span>
                  </div>
                  <div style={{ fontSize: 11, color: sk.textDim, padding: "0 4px", marginBottom: 12 }}>Total games: {totalGames}</div>
                  <button onClick={closeStats} style={{ width: "100%", padding: "11px", borderRadius: 10, border: "none", background: sk.btnActive, color: sk.accentText, fontWeight: "bold", fontSize: 14, cursor: "pointer", fontFamily: "'Georgia', serif", letterSpacing: 1 }}>CLOSE</button>
                  <button onClick={handleStatsReset} style={{ width: "100%", padding: "7px", borderRadius: 8, border: "none", background: "transparent", color: statsResetArmed ? "#e74c3c" : sk.textDim, fontSize: 11, cursor: "pointer", fontFamily: "'Georgia', serif", marginTop: 4, textDecoration: "underline" }}>
                    {statsResetArmed ? "Tap again to confirm reset" : "Reset stats"}
                  </button>
                </div>
              </div>
            )}
            {prePromptOverlay}
          </div>
        );
      }

      const localMode = gameMode === "local";
      const humanCanAct = !gameOver && !busy && (localMode || currentPlayer === 0);
      const validMoves = humanCanAct ? getValidMoves(board, currentPlayer) : [];

      // isYours = your row (the bottom row of the board).
      const renderPit = (idx, isYours) => {
        const count = board[idx];
        // validMoves only ever holds the acting player's own pits, so this
        // doubles as the side check in both cpu and pass-and-play modes.
        const canPlay = validMoves.includes(idx);
        const isBest = strategy && strategy.bestMove === idx;
        const isActive = activePit === idx;
        const maxShow = bscale < 0.8 ? 6 : 10;
        const sz = Math.round((count > 6 ? 13 : 17) * bscale);
        const ids = marbleMap[idx] || [];
        const pitMax = Math.round(64 * bscale);
        const labelFont = Math.max(9, Math.round(10 * bscale));
        const badgeFont = Math.max(9, Math.round(11 * bscale));
        const ownSide = localMode ? (currentPlayer === 0 ? isYours : !isYours) : isYours;
        const label = isYours ? idx + 1 : idx - 6;
        return (
          <div key={idx} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", minWidth: 0 }}>
            {!isYours && <div style={{ fontSize: labelFont, color: canPlay ? sk.accent : sk.textDim, marginBottom: 2 }}>{label}</div>}
            <div
              ref={(el) => { pitRefs.current[idx] = el; }}
              onClick={() => handlePitClick(idx)}
              style={{
                width: "100%", maxWidth: pitMax, aspectRatio: "1", borderRadius: "50%",
                background: isActive ? "radial-gradient(circle, #3a6a2a, #1a3a1a)" : sk.pitBg,
                border: isActive ? "2px solid #7cfc00" : isBest ? "2px solid #4CAF50" : canPlay ? "2px solid " + sk.accent : "2px solid " + sk.pitBorder,
                boxShadow: isActive ? "0 0 18px rgba(124,252,0,0.5), inset 0 3px 10px rgba(0,0,0,0.5)"
                  : isBest ? "0 0 12px rgba(76,175,80,0.4), inset 0 3px 10px rgba(0,0,0,0.5)"
                  : canPlay ? "0 0 10px " + sk.accent + "55, inset 0 3px 10px rgba(0,0,0,0.5)"
                  : "inset 0 3px 10px rgba(0,0,0,0.5)",
                cursor: canPlay ? "pointer" : "default",
                transition: "border 0.12s, box-shadow 0.12s", position: "relative",
                opacity: count === 0 && ownSide ? 0.4 : 1,
              }}
            >
              {/* Marbles clip inside this inner circle; the count badge sits on the
                  unclipped wrapper so it stays visible at every board size. */}
              <div style={{ position: "absolute", inset: 0, borderRadius: "50%", overflow: "hidden", display: "flex", flexWrap: "wrap", alignItems: "center", justifyContent: "center", gap: 1, padding: 4 }}>
                {ids.slice(0, maxShow).map((mid) => <Marble key={mid} id={mid} size={sz} bg={sk.marble} />)}
                {count > maxShow && <div style={{ fontSize: Math.max(7, Math.round(8 * bscale)), color: sk.textDim, fontWeight: "bold" }}>+{count - maxShow}</div>}
              </div>
              {count > 0 && (
                <div style={{ position: "absolute", top: -6, right: -4, fontSize: badgeFont, fontWeight: "bold", color: isActive ? "#7cfc00" : isBest ? "#4CAF50" : sk.accent, background: "rgba(20,12,6,0.92)", borderRadius: 6, padding: "0 3px", lineHeight: (badgeFont + 5) + "px", minWidth: badgeFont + 5, textAlign: "center", border: "1px solid " + sk.storeBorder, zIndex: 2 }}>{count}</div>
              )}
              {isBest && !busy && <div style={{ position: "absolute", bottom: -labelFont, left: 0, right: 0, textAlign: "center", fontSize: Math.max(7, Math.round(8 * bscale)), color: "#4CAF50", fontWeight: "bold", zIndex: 2 }}>BEST</div>}
            </div>
            {isYours && !isBest && <div style={{ fontSize: labelFont, color: canPlay ? sk.accent : sk.textDim, marginTop: 3 }}>{label}</div>}
          </div>
        );
      };

      // Landscape: tall store columns on the left/right of the pit grid.
      const renderStore = (pitIdx, label, color) => {
        const count = board[pitIdx];
        const isActive = activePit === pitIdx;
        const maxShow = bscale < 0.8 ? 12 : 20;
        const sz = Math.round((count > 14 ? 10 : 13) * bscale);
        const ids = marbleMap[pitIdx] || [];
        const storeW = Math.round(66 * bscale);
        return (
          <div ref={(el) => { pitRefs.current[pitIdx] = el; }} style={{
            width: storeW, borderRadius: Math.round(storeW / 2),
            background: isActive ? "radial-gradient(circle, " + color + "33, " + sk.bg1 + ")" : sk.storeBg,
            border: isActive ? "2px solid " + color : "2px solid " + sk.storeBorder,
            boxShadow: isActive ? "0 0 15px " + color + "55, inset 0 4px 16px rgba(0,0,0,0.6)" : "inset 0 4px 16px rgba(0,0,0,0.6)",
            display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center",
            padding: "8px 4px", transition: "border 0.12s, box-shadow 0.12s",
          }}>
            <div style={{ fontSize: Math.max(8, Math.round(9 * bscale)), color: sk.textDim, marginBottom: 3, letterSpacing: 1 }}>{label}</div>
            <div style={{ display: "flex", flexWrap: "wrap", alignItems: "center", justifyContent: "center", gap: 1, flex: 1, overflow: "hidden" }}>
              {ids.slice(0, maxShow).map((mid) => <Marble key={mid} id={mid} size={sz} bg={sk.marble} />)}
              {count > maxShow && <div style={{ fontSize: 7, color: sk.textDim }}>+{count - maxShow}</div>}
            </div>
            <div style={{ fontSize: Math.round(18 * bscale), fontWeight: "bold", color: color, marginTop: 4 }}>{count}</div>
          </div>
        );
      };

      // Portrait: wide store bars above/below the pit grid, freeing the full
      // board width for the six pit columns (bigger pits, bigger touch targets).
      const renderStoreH = (pitIdx, label, color) => {
        const count = board[pitIdx];
        const isActive = activePit === pitIdx;
        const maxShow = 22;
        const sz = Math.round((count > 14 ? 10 : 13) * bscale);
        const ids = marbleMap[pitIdx] || [];
        const storeH = Math.round(54 * bscale);
        return (
          <div ref={(el) => { pitRefs.current[pitIdx] = el; }} style={{
            width: "100%", height: storeH, borderRadius: Math.round(storeH / 2),
            background: isActive ? "radial-gradient(circle, " + color + "33, " + sk.bg1 + ")" : sk.storeBg,
            border: isActive ? "2px solid " + color : "2px solid " + sk.storeBorder,
            boxShadow: isActive ? "0 0 15px " + color + "55, inset 0 4px 16px rgba(0,0,0,0.6)" : "inset 0 4px 16px rgba(0,0,0,0.6)",
            display: "flex", alignItems: "center", gap: 8,
            padding: "4px 14px", transition: "border 0.12s, box-shadow 0.12s",
          }}>
            <div style={{ fontSize: Math.max(8, Math.round(9 * bscale)), color: sk.textDim, letterSpacing: 1, width: 34, flexShrink: 0 }}>{label}</div>
            <div style={{ flex: 1, display: "flex", flexWrap: "wrap", alignItems: "center", justifyContent: "center", gap: 1, overflow: "hidden", maxHeight: "100%" }}>
              {ids.slice(0, maxShow).map((mid) => <Marble key={mid} id={mid} size={sz} bg={sk.marble} />)}
              {count > maxShow && <div style={{ fontSize: 8, color: sk.textDim }}>+{count - maxShow}</div>}
            </div>
            <div style={{ fontSize: Math.round(19 * bscale), fontWeight: "bold", color: color, minWidth: 30, textAlign: "right", flexShrink: 0 }}>{count}</div>
          </div>
        );
      };

      const canUndo = training && undoStack.length > 0 && !busy && !gameOver;

      return (
        <div style={{ height: "100%", background: "linear-gradient(145deg, " + sk.bg1 + " 0%, " + sk.bg2 + " 50%, " + sk.bg1 + " 100%)", fontFamily: "'Georgia', 'Times New Roman', serif", color: sk.text, display: "flex", flexDirection: "column" }}>
          <style>{`@keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.4; } }`}</style>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: isLandscape ? "4px 14px" : "10px 14px", background: "rgba(0,0,0,0.3)", borderBottom: "1px solid " + sk.panelBorder }}>
            <div>
              <div style={{ fontSize: 15, fontWeight: "bold", color: sk.accent, letterSpacing: 2 }}>MANCALA</div>
              {localMode ? <div style={{ fontSize: 10, color: "#e67e22", fontWeight: "bold", letterSpacing: 1 }}>PASS &amp; PLAY</div>
                : training ? <div style={{ fontSize: 10, color: "#3498db", fontWeight: "bold", letterSpacing: 1 }}>TRAINING vs {CPU_LABELS[cpuLevel]}{!goFirst ? " (2nd)" : ""}</div>
                : <div style={{ fontSize: 10, color: CPU_CLR[cpuLevel] }}>vs {CPU_LABELS[cpuLevel]}{!goFirst ? " (2nd)" : ""}</div>}
            </div>
            <div style={{ textAlign: "center" }}>
              {stonesInHand > 0 ? (
                <div style={{ fontSize: 12, color: "#7cfc00", animation: "pulse 0.6s infinite", fontWeight: "bold" }}>Sowing... {stonesInHand} left</div>
              ) : (
                <div style={{ fontSize: 14, fontWeight: "bold", color: gameOver ? sk.accent : currentPlayer === 0 ? "#4CAF50" : "#e67e22" }}>
                  {gameOver ? "GAME OVER"
                    : localMode ? (currentPlayer === 0 ? "PLAYER 1'S TURN" : "PLAYER 2'S TURN")
                    : currentPlayer === 0 ? "YOUR TURN" : "CPU THINKING..."}
                </div>
              )}
            </div>
            <div style={{ display: "flex", gap: 4 }}>
              {canUndo && (
                <button onClick={handleUndo} style={{ padding: "6px 10px", borderRadius: 6, border: "1px solid #3498db", background: "rgba(52,152,219,0.15)", color: "#3498db", fontSize: 11, cursor: "pointer", fontFamily: "'Georgia', serif", fontWeight: "bold" }}>Undo</button>
              )}
              <button onClick={toggleSound} aria-label={soundOn ? "Mute sounds" : "Unmute sounds"} style={{ padding: "6px 10px", borderRadius: 6, border: "1px solid " + sk.panelBorder, background: sk.btnPassive, color: sk.accent, fontSize: 12, cursor: "pointer", fontFamily: "'Georgia', serif", textDecoration: soundOn ? "none" : "line-through", opacity: soundOn ? 1 : 0.55 }}>&#9834;</button>
